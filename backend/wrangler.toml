# Cloudflare Workers config for the Holdclose caregiver forum.
#
# - `FORUM_DB` is the D1 database holding profiles / posts / comments / votes / reports.
# - `FORUM_MEDIA` is the R2 bucket holding avatars + post image attachments.
#
# Before the first `wrangler dev` or `wrangler deploy`:
#   1. Create the D1 database:  `wrangler d1 create holdclose-forum`
#      and paste the returned UUID into `database_id` below.
#   2. Create the R2 bucket:    `wrangler r2 bucket create holdclose-forum-media`
#   3. Set the JWT secret:      `wrangler secret put FORUM_JWT_SECRET`
#      (Phase 13.3 — auth middleware).
#
# Local dev (`wrangler dev`) and `vitest` use miniflare's in-process D1/R2
# emulators, so steps 1–3 are only required for remote (`wrangler deploy`).

name = "holdclose-forum"
main = "src/index.ts"
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat"]

# Phase 13.13: weekly metrics watchdog. Mondays at 13:00 UTC
# (~6am Pacific) keeps the email out of the operator's weekend.
[triggers]
crons = ["0 13 * * 1"]

[vars]
# Public origin of the R2 bucket fronting avatar / post-image uploads.
# Profile avatar_url updates must start with this prefix so the API
# can't be used to point at arbitrary off-platform images. Overridden
# per environment via `wrangler deploy --var R2_PUBLIC_URL:...`.
R2_PUBLIC_URL = "https://media.holdclose.local"

# Allowed audience(s) for POST /api/v1/auth/google — the Google *Web* OAuth
# client id (the app sets it as serverClientId so iOS+Android ID tokens both
# carry it as `aud`). May be a comma-separated list to allow additional
# audiences (e.g. a native iOS client id). The Web client id is public, not a
# secret, so it lives here; override per environment via
# `wrangler deploy --var GOOGLE_CLIENT_ID:...` or set it for local dev in
# `.dev.vars`.
GOOGLE_CLIENT_ID = "187697773608-uha89s0cc6f9bm4mefcu7r93sopas5jq.apps.googleusercontent.com,187697773608-ica8fo1ho8brojse9ai1lq63kbb2nqae.apps.googleusercontent.com"

# Watchdog wiring (Phase 13.13). Non-secret values live here; secrets
# (CLOUDFLARE_API_TOKEN, RESEND_API_KEY) are set via `wrangler secret
# put`. See backend/README.md → "Watchdog setup".
RESEND_FROM_EMAIL = "watchdog@holdclose.local"
RESEND_TO_EMAIL = "ops@holdclose.local"
CLOUDFLARE_ACCOUNT_ID = ""
CLOUDFLARE_D1_DATABASE_ID = ""
CLOUDFLARE_R2_BUCKET_NAME = "holdclose-forum-media"

[[d1_databases]]
binding = "FORUM_DB"
database_name = "holdclose-forum"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "FORUM_MEDIA"
bucket_name = "holdclose-forum-media"

# Document scans (emergency card / POA / ID images). Stored under a
# circle-namespaced key so blobs survive a reinstall and sync across the
# care circle. Local `wrangler dev` + vitest use miniflare's in-process R2
# emulator (blobs persist under .wrangler/state), so no real bucket is
# required for alpha; create it before remote deploy:
#   wrangler r2 bucket create holdclose-doc-blobs
[[r2_buckets]]
binding = "DOC_BLOBS"
bucket_name = "holdclose-doc-blobs"
