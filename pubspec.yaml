name: careblazers
description: "In-the-moment coach for dementia caregivers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  go_router: ^14.0.0

  # Models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Storage
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.0
  path: ^1.9.0
  flutter_secure_storage: ^9.2.0

  # Network
  dio: ^5.7.0

  # Audio / TTS
  flutter_tts: ^4.2.0

  # Typography
  google_fonts: ^6.2.0

  # Auth
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0

  # PDF export (doctor visit packet)
  pdf: ^3.11.0
  printing: ^5.13.0

  # Misc UI
  flutter_svg: ^2.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

  # Golden tests (visual regression). Alchemist handles platform-
  # specific font rendering differences so goldens pass on both
  # macOS and Linux CI.
  alchemist: ^0.11.0

  # Code gen
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  drift_dev: ^2.20.0
  riverpod_generator: ^2.6.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/seed/
